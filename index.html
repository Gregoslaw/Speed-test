<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test Polska - Gregosław</title>
    <style>
        /* Stylizacja tła i karty, zgodna z Twoim pierwotnym projektem */
        body {
            font-family: 'Open Sans', 'Helvetica', sans-serif;
            text-align: center;
            background: #000000; /* Czarne tło */
            color: #ffffff;
            padding: 20px 10px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Pełna wysokość ekranu */
        }
        .card {
            background: #16161a; /* Ciemnoszara karta */
            width: 100%;
            max-width: 800px; /* Szersza karta dla lepszego widoku OpenSpeedTest */
            height: 600px; /* Stała wysokość karty */
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden; /* Ukrywa wystające elementy iframe */
            position: relative;
        }
        h2 {
            color: #f0f0f0;
            margin-top: 10px;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 20px;
        }
        
        /* Stylizacja iframe OpenSpeedTest */
        iframe {
            width: 100%;
            height: calc(100% - 40px); /* Wysokość karty minus nagłówek */
            border: none;
            border-radius: 0 0 16px 16px; /* Zaokrąglenie tylko na dole */
            position: absolute;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>SPEED TEST STALOWA WOLA (by OpenSpeedTest)</h2>
    
    <!-- 
      INTEGRACJA OPENSPEEDTEST
      To jest oficjalny widget OpenSpeedTest hostowany na ich serwerach,
      ale osadzony bezpośrednio na Twojej stronie. Gwarantuje niezawodność
      i prawdziwe wyniki, omijając rygorystyczne blokady GitHub Pages.
    -->
    <iframe src="https://openspeedtest.com/speedtest" allow="geolocation; microphone; camera; midi; encrypted-media;"></iframe>
</div>

</body>
</html>
