<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px 10px; background: #0b0b0e; color: #fff; }
        .card { background: #16161a; max-width: 480px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        button { background: #007bff; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.2s; }
        button:disabled { background: #444; cursor: not-allowed; }
        .wa-btn { background: #25D366; text-decoration: none; color: white; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; display: block; text-align: center; }
        #canvas-container { margin-top: 20px; display: none; }
        canvas { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid #333; }
        #status { margin-bottom: 10px; color: #00f2fe; font-size: 15px; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">TEST PRĘDKOŚCI ŁĄCZA</h2>
    <div id="status">Naciśnij przycisk, aby rozpocząć pełny pomiar</div>
    
    <button id="startBtn" onclick="runFullTest()">ROZPOCZNIJ TEST</button>

    <div id="canvas-container">
        <canvas id="resultCanvas" width="500" height="280"></canvas>
        <a id="waBtn" class="wa-btn" target="_blank">Wyślij wynik przez WhatsApp</a>
    </div>
</div>

<script>
const TARGET_PHONE = "48509265035";

async function runFullTest() {
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const container = document.getElementById('canvas-container');

    startBtn.disabled = true;
    container.style.display = 'none';

    try {
        // 1. Pomiar PING
        status.innerText = "1/3 Mierzenie opóźnienia (Ping)...";
        const ping = await measurePing();

        // 2. Pomiar POBIERANIA (Download)
        status.innerText = "2/3 Mierzenie prędkości pobierania (Download)...";
        const downloadMbps = await measureDownload();

        // 3. Pomiar WYSYŁANIA (Upload)
        status.innerText = "3/3 Mierzenie prędkości wysyłania (Upload)...";
        const uploadMbps = await measureUpload();

        status.innerText = "Test zakończony!";

        // Generowanie karty wynikowej na canvas
        drawCard(ping, downloadMbps, uploadMbps);

        // Przygotowanie linku bezpośredniego do WhatsAppa
        const waText = encodeURIComponent(
            `📊 *WYNIK TESTU PRĘDKOŚCI*\n` +
            `⏱ *Ping:* ${ping} ms\n` +
            `⬇ *Pobieranie:* ${downloadMbps} Mbps\n` +
            `⬆ *Wysyłanie:* ${uploadMbps} Mbps\n` +
            `📅 *Data:* ${new Date().toLocaleString('pl-PL')}`
        );
        document.getElementById('waBtn').href = `https://wa.me/${TARGET_PHONE}?text=${waText}`;

        container.style.display = 'block';

    } catch (err) {
        console.error(err);
        status.innerText = "Błąd podczas wykonywania testu!";
    } finally {
        startBtn.disabled = false;
    }
}

// Funkcja mierzenia PING
async function measurePing() {
    const pings = [];
    for (let i = 0; i < 4; i++) {
        const start = performance.now();
        await fetch('https://gregoslaw.github.io/Speed-test/20MB.bin?ping=' + Math.random(), { method: 'HEAD' });
        pings.push(performance.now() - start);
    }
    const avgPing = pings.reduce((a, b) => a + b, 0) / pings.length;
    return Math.round(avgPing);
}

// Funkcja mierzenia POBIERANIA (3 x 20 MB = 60 MB)
async function measureDownload() {
    const fileSizeMB = 20;
    const iterations = 3;
    let totalTimeSec = 0;

    for (let i = 0; i < iterations; i++) {
        const startTime = performance.now();
        const response = await fetch('https://gregoslaw.github.io/Speed-test/20MB.bin?cache=' + Math.random());
        await response.blob();
        totalTimeSec += (performance.now() - startTime) / 1000;
    }

    const totalDownloadedMB = fileSizeMB * iterations;
    return ((totalDownloadedMB * 8) / totalTimeSec).toFixed(2);
}

// Funkcja mierzenia WYSYŁANIA (Upload 6 MB danych)
async function measureUpload() {
    const uploadSizeMB = 6;
    const bytes = new Uint8Array(uploadSizeMB * 1024 * 1024);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });

    const startTime = performance.now();
    try {
        await fetch('https://httpbin.org/post', {
            method: 'POST',
            body: blob
        });
    } catch (e) {}
    const endTime = performance.now();

    const durationInSeconds = (endTime - startTime) / 1000;
    return ((uploadSizeMB * 8) / durationInSeconds).toFixed(2);
}

// Rysowanie wizytówki z wynikami
function drawCard(ping, download, upload) {
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');

    // Tło
    ctx.fillStyle = '#0f0f12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Nagłówek
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('SPEEDTEST', 25, 38);

    ctx.fillStyle = '#888888';
    ctx.font = '12px Arial';
    const now = new Date();
    ctx.fillText(now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 340, 38);

    // Linia
    ctx.strokeStyle = '#22222a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(25, 50);
    ctx.lineTo(475, 50);
    ctx.stroke();

    // POBIERANIE (Download)
    ctx.fillStyle = '#00f2fe';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('⬇ POBIERANIE Mbps', 25, 85);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px Arial';
    ctx.fillText(download, 25, 135);

    // WYSYŁANIE (Upload)
    ctx.fillStyle = '#b155ea';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('⬆ WYSYŁANIE Mbps', 260, 85);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px Arial';
    ctx.fillText(upload, 260, 135);

    // PING
    ctx.fillStyle = '#888888';
    ctx.font = '13px Arial';
    ctx.fillText('Ping / Opóźnienie:', 25, 180);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(ping + ' ms', 150, 180);

    // Stopka
    ctx.fillStyle = '#1c1c24';
    ctx.fillRect(0, 215, canvas.width, 65);

    ctx.fillStyle = '#aaaaaa';
    ctx.font = '13px Arial';
    ctx.fillText('Host: GitHub Pages (gregoslaw)', 25, 252);
}
</script>

</body>
</html>
