<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twój Wynik Testu Prędkości - Gregosław</title>
    <!-- Ikony FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1c2e;
            --tile-bg: #1e2a3a;
            --text-color: #ffffff;
            --primary-accent: #3b82f6; 
            --tile-border: #2d3b4f;
            --whatsapp-green: #25D366;
            --signal-blue: #3267E4;
            --messenger-blue: #0084FF;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; flex-direction: column;}
        
        .screen-container { width: 100%; max-width: 480px; height: 90vh; background-color: var(--tile-bg); border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; margin-bottom: 20px;}
        .screen-content { flex: 1; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column;}

        h1.title { font-size: 20px; font-weight: 300; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; text-align: center;}

        /* Osadzenie OpenSpeedTest */
        .iframe-container {
            width: 100%;
            height: 400px; /* Stała wysokość na start, może się dostosować */
            background-color: #000; /* Czarne tło pod iframe, aby wyglądał spójnie */
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Przyciski Akcji */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-action {
            flex: 1;
            background-color: var(--primary-accent);
            color: var(--text-color);
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-action i { font-size: 18px; }

        /* Ikony Komunikatorów - Sekcja Bezpośredniego Udostępniania */
        .share-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .share-icon-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            color: var(--text-color);
            transition: transform 0.2s;
        }
        .share-icon-btn:hover { transform: scale(1.1); }
        .btn-whatsapp { background-color: var(--whatsapp-green); }
        .btn-signal { background-color: var(--signal-blue); }
        .btn-messenger { background-color: var(--messenger-blue); }

    </style>
</head>
<body>

<div class="screen-container">
    <div class="screen-content">
        <h1 class="title">TEST PRĘDKOŚCI - OPENSPEEDTEST</h1>

        <!-- KONTENER NA IFRAME OPENSPEEDTEST -->
        <div class="iframe-container">
            <!-- Osadzamy oficjalny tester HTML5 -->
            <iframe src="https://openspeedtest.com/speedtest" allow="geolocation; microphone; camera; midi; encrypted-media;"></iframe>
        </div>

        <div class="action-buttons">
            <button class="btn-action"><i class="fa-regular fa-file-lines"></i> SZCZEGÓŁY</button>
            <!-- Nowy test po prostu odświeża stronę -->
            <button class="btn-action" onclick="location.reload()"><i class="fa-solid fa-arrows-rotate"></i> NOWY TEST</button>
        </div>

        <!-- SEKCJA UDOSTĘPNIANIA - TO JEST NAJWAŻNIEJSZE -->
        <p style="text-align: center; color: #b0c4de; margin-bottom: 15px; font-weight: 300;">Udostępnij bezpośrednio przez:</p>
        <div class="share-icons">
            <button class="share-icon-btn btn-whatsapp" onclick="shareWhatsApp()" title="Udostępnij przez WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>
            <button class="share-icon-btn btn-signal" onclick="shareSignal()" title="Udostępnij przez Signal"><i class="fa-brands fa-signal"></i></button>
            <button class="share-icon-btn btn-messenger" onclick="shareMessenger()" title="Udostępnij przez Messenger"><i class="fa-brands fa-facebook-messenger"></i></button>
        </div>

    </div>
</div>

<script>
    // Konfiguracja tekstu do udostępnienia (Link do Twojej strony GitHub)
    const shareText = "Sprawdź mój wynik testu prędkości internetu, który wykonałem pod Twoim adresem! ";
    const yourPageUrl = "https://gregoslaw.github.io/Speed-test/";

    // Funkcje bezpośredniego udostępniania
    function shareWhatsApp() {
        const url = "whatsapp://send?text=" + encodeURIComponent(shareText + yourPageUrl);
        location.href = url;
    }

    function shareSignal() {
        // Signal nie ma dedykowanego URI do udostępniania tekstu (przynajmniej powszechnie znanego), 
        // to jest najlepsza próba otwarcia aplikacji i wklejenia tekstu przez systemowy share sheet.
        const textToShare = shareText + yourPageUrl;
        
        // Próbujemy otworzyć systemowe menu udostępniania (działa na telefonach)
        if (navigator.share) {
            navigator.share({
                title: 'Wynik Testu Prędkości',
                text: shareText,
                url: yourPageUrl,
            })
            .catch((error) => console.log('Błąd udostępniania', error));
        } else {
            // Alternatywa: wklejamy do schowka, aby klient wkleił w Signalu
            navigator.clipboard.writeText(textToShare);
            alert("Tekst i link skopiowano do schowka. Wklej go bezpośrednio w Signal.");
        }
    }

    function shareMessenger() {
        // Facebook Messenger (Wymaga aktywnego konta i aplikacji na telefonie)
        const url = "fb-messenger://share?link=" + encodeURIComponent(yourPageUrl) + "&app_id=291494419107518";
        location.href = url;
    }
</script>

</body>
</html>
