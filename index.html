<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px 10px; background: #0b0b0e; color: #fff; }
        .card { background: #16161a; max-width: 480px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        button { background: #007bff; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.2s; }
        button:disabled { background: #444; cursor: not-allowed; }
        .share-btn { background: #25D366; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; width: 100%; cursor: pointer; }
        #canvas-container { margin-top: 20px; display: none; }
        canvas { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid #333; }
        #status { margin-bottom: 10px; color: #00f2fe; font-size: 15px; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">TEST PRĘDKOŚCI ŁĄCZA</h2>
    <div id="status">Naciśnij przycisk, aby rozpocząć pełny pomiar</div>
    
    <button id="startBtn" onclick="runFullTest()">ROZPOCZNIJ TEST</button>

    <div id="canvas-container">
        <canvas id="resultCanvas" width="500" height="280"></canvas>
        <button id="shareBtn" class="share-btn" onclick="shareResultImage()">Udostępnij wynik (Grafika)</button>
    </div>
</div>

<script>
let imageBlob = null;
let shareDataText = "";

async function runFullTest() {
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const container = document.getElementById('canvas-container');

    startBtn.disabled = true;
    container.style.display = 'none';

    try {
        // 1. Pomiar PING
        status.innerText = "1/3 Mierzenie opóźnienia (Ping)...";
        const ping = await measurePing();

        // 2. Pomiar POBIERANIA (Download)
        status.innerText = "2/3 Mierzenie prędkości pobierania (Download)...";
        const downloadMbps = await measureDownload();

        // 3. Pomiar WYSYŁANIA (Upload)
        status.innerText = "3/3 Mierzenie prędkości wysyłania (Upload)...";
        const uploadMbps = await measureUpload();

        status.innerText = "Test zakończony!";

        // Generowanie karty wynikowej
        drawCard(ping, downloadMbps, uploadMbps);

        // Zamiana canvas na plik graficzny Blob
        const canvas = document.getElementById('resultCanvas');
        canvas.toBlob((blob) => {
            imageBlob = blob;
        }, 'image/png');

        shareDataText = `📊 Speedtest Result: Download ${downloadMbps} Mbps / Upload ${uploadMbps} Mbps / Ping ${ping} ms`;

        container.style.display = 'block';

    } catch (err) {
        console.error(err);
        status.innerText = "Błąd podczas wykonywania testu!";
    } finally {
        startBtn.disabled = false;
    }
}

// Udostępnianie PLIKU GRAFICZNEGO do WhatsApp / Signal / Messenger
async function shareResultImage() {
    if (!imageBlob) return;

    const file = new File([imageBlob], 'speedtest-result.png', { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({
                files: [file],
                title: 'Wynik Speedtest',
                text: shareDataText
            });
        } catch (err) {
            console.log('Anulowano udostępnianie');
        }
    } else {
        alert("Twoja przeglądarka nie obsługuje bezpośredniego udostępniania plików. Przytrzymaj palec na obrazku wyżej i wybierz 'Kopiuj' lub 'Zapisz'.");
    }
}

// Poprawiony pomiar PING (bez buforowania)
async function measurePing() {
    const pings = [];
    for (let i = 0; i < 4; i++) {
        const start = performance.now();
        await fetch('https://gregoslaw.github.io/Speed-test/20MB.bin?r=' + Date.now() + Math.random(), {
            method: 'HEAD',
            cache: 'no-store'
        });
        pings.push(performance.now() - start);
    }
    const avgPing = pings.reduce((a, b) => a + b, 0) / pings.length;
    return Math.round(avgPing);
}

// Poprawiony pomiar POBIERANIA (bez cache + odczyt strumieniowy)
async function measureDownload() {
    const fileSizeMB = 20;
    const iterations = 2;
    let totalTimeSec = 0;

    for (let i = 0; i < iterations; i++) {
        const startTime = performance.now();
        const response = await fetch('https://gregoslaw.github.io/Speed-test/20MB.bin?r=' + Date.now() + Math.random(), {
            cache: 'no-store'
        });
        
        const reader = response.body.getReader();
        while (true) {
            const { done } = await reader.read();
            if (done) break;
        }
        
        const endTime = performance.now();
        totalTimeSec += (endTime - startTime) / 1000;
    }

    const totalDownloadedMB = fileSizeMB * iterations;
    return ((totalDownloadedMB * 8) / totalTimeSec).toFixed(2);
}

// Pomiar WYSYŁANIA
async function measureUpload() {
    const uploadSizeMB = 6;
    const bytes = new Uint8Array(uploadSizeMB * 1024 * 1024);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });

    const startTime = performance.now();
    try {
        await fetch('https://httpbin.org/post', {
            method: 'POST',
            body: blob
        });
    } catch (e) {}
    const durationInSeconds = (performance.now() - startTime) / 1000;
    return ((uploadSizeMB * 8) / durationInSeconds).toFixed(2);
}

// Rysowanie karty wyników
function drawCard(ping, download, upload) {
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');

    // Tło
    ctx.fillStyle = '#0f0f12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Nagłówek
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('SPEEDTEST', 25, 38);

    ctx.fillStyle = '#888888';
    ctx.font = '12px Arial';
    const now = new Date();
    ctx.fillText(now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 340, 38);

    // Linia
    ctx.strokeStyle = '#22222a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(25, 50);
    ctx.lineTo(475, 50);
    ctx.stroke();

    // POBIERANIE (Download)
    ctx.fillStyle = '#00f2fe';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('⬇ POBIERANIE Mbps', 25, 85);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px Arial';
    ctx.fillText(download, 25, 135);

    // WYSYŁANIE (Upload)
    ctx.fillStyle = '#b155ea';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('⬆ WYSYŁANIE Mbps', 260, 85);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px Arial';
    ctx.fillText(upload, 260, 135);

    // PING
    ctx.fillStyle = '#888888';
    ctx.font = '13px Arial';
    ctx.fillText('Ping / Opóźnienie:', 25, 180);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(ping + ' ms', 150, 180);

    // Stopka
    ctx.fillStyle = '#1c1c24';
    ctx.fillRect(0, 215, canvas.width, 65);

    ctx.fillStyle = '#aaaaaa';
    ctx.font = '13px Arial';
    ctx.fillText('Host: GitHub Pages (gregoslaw)', 25, 252);
}
</script>

</body>
</html>
