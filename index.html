<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 30px 15px; background: #0b0b0e; color: #fff; }
        .card { background: #16161a; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        button { background: #007bff; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.2s; }
        button:disabled { background: #444; cursor: not-allowed; }
        .wa-btn { background: #25D366; text-decoration: none; color: white; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; display: block; text-align: center; }
        #canvas-container { margin-top: 20px; display: none; }
        canvas { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid #333; }
        #status { margin-bottom: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">TEST PRĘDKOŚCI</h2>
    <div id="status">Naciśnij przycisk, aby rozpocząć pomiar</div>
    
    <button id="startBtn" onclick="runTest()">ROZPOCZNIJ TEST</button>

    <div id="canvas-container">
        <canvas id="resultCanvas" width="500" height="260"></canvas>
        <a id="waBtn" class="wa-btn" target="_blank">Wyślij wynik przez WhatsApp</a>
    </div>
</div>

<script>
const PHONE_NUMBER = "48123456789"; // Podmień na swój numer telefonu z kierunkowym kraju

async function runTest() {
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const container = document.getElementById('canvas-container');

    startBtn.disabled = true;
    container.style.display = 'none';
    status.innerText = "Mierzenie prędkości pobierania...";

    const fileUrl = 'https://gregoslaw.github.io/Speed-test/20MB.bin?cache=' + Math.random();
    const fileSizeMB = 20;

    const startTime = performance.now();

    try {
        const response = await fetch(fileUrl);
        await response.blob();
        const endTime = performance.now();

        const durationInSeconds = (endTime - startTime) / 1000;
        const downloadMbps = ((fileSizeMB * 8) / durationInSeconds).toFixed(2);

        status.innerText = "Test zakończony sukcesem!";
        
        drawCard(downloadMbps, durationInSeconds.toFixed(1));

        const text = encodeURIComponent(`📊 Wynik Speedtest:\n⬇ Pobieranie: ${downloadMbps} Mbps\n⏱ Czas: ${durationInSeconds.toFixed(1)}s`);
        document.getElementById('waBtn').href = `https://wa.me/${PHONE_NUMBER}?text=${text}`;

        container.style.display = 'block';

    } catch (err) {
        status.innerText = "Błąd podczas wykonywania testu!";
    } finally {
        startBtn.disabled = false;
    }
}

function drawCard(download, time) {
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#0f0f12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('SPEEDTEST', 25, 40);

    ctx.fillStyle = '#888888';
    ctx.font = '12px Arial';
    const now = new Date();
    ctx.fillText(now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 360, 40);

    ctx.strokeStyle = '#22222a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(25, 55);
    ctx.lineTo(475, 55);
    ctx.stroke();

    ctx.fillStyle = '#00f2fe';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('⬇ POBIERANIE Mbps', 25, 95);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px Arial';
    ctx.fillText(download, 25, 155);

    ctx.fillStyle = '#aaa';
    ctx.font = '14px Arial';
    ctx.fillText('Czas testu:', 280, 95);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText(time + ' s', 280, 130);

    ctx.fillStyle = '#444';
    ctx.fillRect(0, 195, canvas.width, 65);
    
    ctx.fillStyle = '#aaa';
    ctx.font = '13px Arial';
    ctx.fillText('Serwer: GitHub Pages (gregoslaw)', 25, 232);
}
</script>

</body>
</html>
